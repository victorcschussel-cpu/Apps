# Troque o nome antes do primeiro deploy (precisa ser único no Fly).
app = "glicemia-refeicoes"
primary_region = "gru"

[env]
  SYNC_INTERVAL_MIN = "90"

# SQLite mora no volume; sem ele o banco some a cada deploy.
[mounts]
  source = "glicemia_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # O job de sincronização roda dentro do processo: a máquina não pode dormir.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
